# infer-lite catalog. Each provider needs `base_url` (the OpenAI-compatible
# endpoint root — the gateway POSTs to <base_url>/chat/completions or
# <base_url>/embeddings) and `key_env` (slot in keys.env).
#
# Add `discovery = "<kind>"` for providers whose model list comes from
# their /v1/models endpoint. Static providers list models manually below.

# --- auto-discovered ------------------------------------------------------

[[provider]]
name = "openrouter"
key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
discovery = "openrouter_free"

[[provider]]
name = "nvidia"
key_env = "NVIDIA_API_KEY"
base_url = "https://integrate.api.nvidia.com/v1"
discovery = "nvidia_nim"

[[provider]]
name = "gemini"
key_env = "GEMINI_API_KEY"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
discovery = "gemini"

# --- static ---------------------------------------------------------------

[[provider]]
name = "groq"
key_env = "GROQ_API_KEY"
base_url = "https://api.groq.com/openai/v1"

[[provider.model]]
alias = "llama-3.3-70b-groq"
upstream = "llama-3.3-70b-versatile"
groups = ["fast", "smart"]

[[provider.model]]
alias = "kimi-k2-groq"
upstream = "kimi-k2"
groups = ["smart"]

# ---

[[provider]]
name = "cerebras"
key_env = "CEREBRAS_API_KEY"
base_url = "https://api.cerebras.ai/v1"

[[provider.model]]
alias = "llama-3.3-70b-cerebras"
upstream = "llama-3.3-70b"
groups = ["fast", "smart"]

[[provider.model]]
alias = "qwen3-235b-cerebras"
upstream = "qwen-3-235b-a22b"
groups = ["smart"]

# ---

[[provider]]
name = "mistral"
key_env = "MISTRAL_API_KEY"
base_url = "https://api.mistral.ai/v1"

[[provider.model]]
alias = "codestral"
upstream = "codestral-latest"
groups = ["code"]

[[provider.model]]
alias = "mistral-large"
upstream = "mistral-large-latest"
groups = ["smart"]

# ---

[[provider]]
name = "scaleway"
key_env = "SCALEWAY_API_KEY"
base_url = "https://api.scaleway.ai/v1"

[[provider.model]]
alias = "qwen3.5-397b-scaleway"
upstream = "qwen3.5-397b-a17b"
groups = ["smart", "code", "vision"]

[[provider.model]]
alias = "gpt-oss-120b-scaleway"
upstream = "gpt-oss-120b"
groups = ["smart"]

# ---

[[provider]]
name = "together"
key_env = "TOGETHER_API_KEY"
base_url = "https://api.together.xyz/v1"

[[provider.model]]
alias = "llama-3.3-70b-together"
upstream = "meta-llama/Llama-3.3-70B-Instruct-Turbo-Free"
groups = ["smart"]

# ---

[[provider]]
name = "llm7"
key_env = "LLM7_API_KEY"
base_url = "https://api.llm7.io/v1"
optional_key = true

[[provider.model]]
alias = "gpt-oss-llm7"
upstream = "gpt-oss-20b"
groups = ["fast", "free"]

[[provider.model]]
alias = "codestral-llm7"
upstream = "codestral-latest"
groups = ["code", "free"]
